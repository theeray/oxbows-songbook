<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playable sheet music</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#193b4c;font:14px system-ui}.controls{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#f4faff;padding:8px;border-bottom:1px solid #bed9e5}button,input{font:inherit;color:inherit;border:1px solid #b1d0df;border-radius:6px;background:white;padding:8px}input{width:65px}#status{font-size:13px}#score{padding:12px;min-width:650px}.page{overflow:auto}#notation{position:relative}.score-locator{position:absolute;left:0;top:0;width:2px;background:#38a9d6;pointer-events:none;z-index:2}.score-locator[hidden]{display:none}#notation svg{max-width:100%;height:auto}.partMixer{margin:8px;border:1px solid #bed9e5;border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}.partMixer legend{font-weight:600}#partOptions{display:flex;flex-wrap:wrap;gap:10px}.partOption{display:inline-flex;gap:6px;align-items:center}.partOption label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}.partOption input{width:18px;height:18px;accent-color:#1685ad}.partOption button{padding:5px 8px}#mixStatus{font-size:13px}</style></head><body><div class="controls"><button id="play" disabled>Play score</button><button id="stop">Stop</button><label>Tempo · ♩ = <input id="tempo" type="number" min="30" max="240" value="64" aria-label="Playback tempo"></label><button id="full">Full screen</button><span id="audioStatus" role="status"></span><span id="status" role="status">Loading score…</span></div><fieldset class="partMixer"><legend>Score playback · choose parts</legend><button id="allParts" type="button">All parts</button><span id="partOptions"></span><span id="mixStatus" role="status">All parts together</span></fieldset><main class="page"><div id="score"><div id="notation"></div></div></main><script type="module" src="/src/score-viewer.js"></script></body></html>
